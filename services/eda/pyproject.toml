[project]
name = "helix-eda"
version = "0.1.0"
description = "Synchronous dataset summary and plotting service for Helix Reborn, called only by the API."
requires-python = ">=3.12,<3.13"
dependencies = ["helix-core", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[tool.uv.sources]
helix-core = { workspace = true }

[project.scripts]
helix-eda = "helix_eda.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helix_eda"]
