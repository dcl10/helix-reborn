[project]
name = "helix-services"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "eda", "training", "evaluation"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "moto[s3]>=5", "httpx>=0.27"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D", "ANN", "N", "RUF"]
ignore = ["D105", "D107", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["helix_core", "helix_eda", "helix_training", "helix_evaluation"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra"
testpaths = ["packages", "eda", "training", "evaluation"]
asyncio_mode = "auto"
markers = ["integration: needs real RabbitMQ/RustFS/Keycloak; runs only when HELIX_INTEGRATION=1"]
