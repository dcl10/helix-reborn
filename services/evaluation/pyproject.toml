[project]
name = "helix-evaluation"
version = "0.1.0"
description = "Evaluation worker for Helix Reborn: consumes evaluation.jobs and evaluates ONNX models."
requires-python = ">=3.12,<3.13"
dependencies = ["helix-core"]

[tool.uv.sources]
helix-core = { workspace = true }
helix-training = { workspace = true }

[dependency-groups]
dev = ["helix-training"]

[project.scripts]
helix-evaluation = "helix_evaluation.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helix_evaluation"]
